sem-lang-core = { git = "https://github.com/semantic-language/sem-lang", rev = "a7b382aa6bb1ecb26fa160a71bdf784b5772a4cb", version = "=0.10.0" }
sem-lang-context = { git = "https://github.com/semantic-language/sem-lang", rev = "a7b382aa6bb1ecb26fa160a71bdf784b5772a4cb", version = "=0.10.0" }
sem-lang-memory = { git = "https://github.com/semantic-language/sem-lang", rev = "a7b382aa6bb1ecb26fa160a71bdf784b5772a4cb", version = "=0.10.0" }
sem-lang-repository = { git = "https://github.com/semantic-language/sem-lang", rev = "a7b382aa6bb1ecb26fa160a71bdf784b5772a4cb", version = "=0.10.0" }
sem-lang-standard = { git = "https://github.com/semantic-language/sem-lang", rev = "a7b382aa6bb1ecb26fa160a71bdf784b5772a4cb", version = "=0.10.0" }
