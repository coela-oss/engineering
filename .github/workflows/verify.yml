name: Verify public engineering content
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.29.3
      - name: Verify shared content reader and projections
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm test
      - name: Check public content identity and digests
        shell: bash
        run: bash scripts/verify-content.sh
      - name: Read fixed public HATHQ validator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hathq/hat-specifications
          ref: 174fcce8e2b3ffbb68a1ff046e94370563a885f9
          path: .hathq-validator
          persist-credentials: false
      - name: Install validator toolchain in the ephemeral runner
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Validate declaration with HATHQ implementation
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/hathq-validator-target"
          cargo +1.97.1 run --locked --manifest-path .hathq-validator/Cargo.toml -p hat-specifications-cli --bin hat-specifications -- validate "$GITHUB_WORKSPACE/integrations/hat/coela-engineering.hat.toml"
      - name: Read fixed shared MCP implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zixcel/zixcel-mcp-gateway
          ref: 0cfe84b3e0a63cd1a4dbafd822b2fc0db16080eb
          path: .mcp-gateway
          persist-credentials: false
      - name: Accept actual independent read-only MCP consumer
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/mcp-gateway-target"
          cargo +1.97.1 build --locked --manifest-path .mcp-gateway/Cargo.toml --bin zixcel-mcp-gateway
          "$CARGO_TARGET_DIR/debug/zixcel-mcp-gateway" validate-config --config integrations/mcp/public.toml
          ENGINEERING_MCP_BINARY="$CARGO_TARGET_DIR/debug/zixcel-mcp-gateway" pnpm test:mcp
