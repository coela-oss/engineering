name: Verify public engineering content
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read accepted independent Portfolio source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: coela-oss/portfolio
          ref: 79f9c73596bd288b66d3e72ffbc22a382ee0c21b
          fetch-depth: 0
          path: .portfolio-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.29.3
      - name: Verify shared content reader and projections
        env:
          ENGINEERING_PORTFOLIO_SOURCE: ${{ github.workspace }}/.portfolio-source
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm test
          pnpm verify:knowledge
      - name: Install native semantic consumer toolchain in the ephemeral runner
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Compile and accept pinned native semantic consumer
        env:
          COELA_SEMANTIC_INPUT: ${{ runner.temp }}/coela-semantic-input.json
          CARGO_TARGET_DIR: ${{ runner.temp }}/coela-semantic-target
        run: |
          pnpm prepare:semantic "$COELA_SEMANTIC_INPUT"
          cargo +1.97.1 fmt --manifest-path acceptance/semantic/Cargo.toml --check
          cargo +1.97.1 test --locked --manifest-path acceptance/semantic/Cargo.toml
          cargo +1.97.1 clippy --locked --manifest-path acceptance/semantic/Cargo.toml --all-targets -- -D warnings
          cargo +1.97.1 build --locked --manifest-path acceptance/semantic/Cargo.toml
          "$CARGO_TARGET_DIR/debug/coela-semantic-consumer" "$COELA_SEMANTIC_INPUT" > "$RUNNER_TEMP/native-semantic-acceptance.json"
      - name: Accept published independent read-only MCP consumer
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zixcel-mcp-gateway-0.2.0.crate"
          curl --fail --silent --show-error --max-time 30 --max-filesize 1048576 https://static.crates.io/crates/zixcel-mcp-gateway/zixcel-mcp-gateway-0.2.0.crate --output "$archive"
          printf '%s  %s\n' '46ead1b2760ff353eb6bdade23d42ea85f8865d4d7297aa0f2079891f989e2af' "$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/mcp-published-source"
          tar -xzf "$archive" -C "$RUNNER_TEMP/mcp-published-source"
          cargo +1.97.1 install --path "$RUNNER_TEMP/mcp-published-source/zixcel-mcp-gateway-0.2.0" --locked --debug --root "$RUNNER_TEMP/mcp-gateway-install"
          "$RUNNER_TEMP/mcp-gateway-install/bin/zixcel-mcp-gateway" validate-config --config integrations/mcp/public.toml
          ENGINEERING_MCP_BINARY="$RUNNER_TEMP/mcp-gateway-install/bin/zixcel-mcp-gateway" pnpm test:mcp
      - name: Verify interface lifecycle against actual Plugin and independent Portfolio
        id: lifecycle
        env:
          ENGINEERING_PORTFOLIO_SOURCE: ${{ github.workspace }}/.portfolio-source
          ENGINEERING_MCP_BINARY: ${{ runner.temp }}/mcp-gateway-install/bin/zixcel-mcp-gateway
          ENGINEERING_SEMANTIC_BINARY: ${{ runner.temp }}/coela-semantic-target/debug/coela-semantic-consumer
          LIFECYCLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-lifecycle.mts --base "$LIFECYCLE_BASE" > "$RUNNER_TEMP/interface-lifecycle-report.json"
      - name: Retain interface coverage and change plan
        if: ${{ always() && steps.lifecycle.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: interface-lifecycle-${{ github.sha }}
          path: |
            ${{ runner.temp }}/interface-lifecycle-report.json
            ${{ runner.temp }}/native-semantic-acceptance.json
          if-no-files-found: error
      - name: Package immutable plugin candidate
        run: pnpm package:plugin "$RUNNER_TEMP/coela-engineering-plugin"
      - name: Retain plugin candidate and source evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coela-engineering-plugin-${{ github.sha }}
          path: |
            ${{ runner.temp }}/coela-engineering-plugin/*.tar
            ${{ runner.temp }}/coela-engineering-plugin/release.json
            ${{ runner.temp }}/coela-engineering-plugin/SHA256SUMS
          if-no-files-found: error
      - name: Package canonical Web projection closure
        run: pnpm package:web "$RUNNER_TEMP/coela-engineering-web"
      - name: Retain Web release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coela-engineering-web-${{ github.sha }}
          path: |
            ${{ runner.temp }}/coela-engineering-web/*.tar
            ${{ runner.temp }}/coela-engineering-web/release.json
            ${{ runner.temp }}/coela-engineering-web/SHA256SUMS
          if-no-files-found: error
      - name: Package native semantic source closure
        run: pnpm package:semantic "$RUNNER_TEMP/coela-engineering-semantic"
      - name: Retain semantic source candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coela-engineering-semantic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/coela-engineering-semantic/*.tar
            ${{ runner.temp }}/coela-engineering-semantic/release.json
            ${{ runner.temp }}/coela-engineering-semantic/SHA256SUMS
          if-no-files-found: error
      - name: Check public content identity and digests
        shell: bash
        run: bash scripts/verify-content.sh
      - name: Read fixed public HATHQ validator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hathq/hat-specifications
          ref: 174fcce8e2b3ffbb68a1ff046e94370563a885f9
          path: .hathq-validator
          persist-credentials: false
      - name: Install validator toolchain in the ephemeral runner
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Validate declaration with HATHQ implementation
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/hathq-validator-target"
          cargo +1.97.1 run --locked --manifest-path .hathq-validator/Cargo.toml -p hat-specifications-cli --bin hat-specifications -- validate "$GITHUB_WORKSPACE/integrations/hat/coela-engineering.hat.toml"
