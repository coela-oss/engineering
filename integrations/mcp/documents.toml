text = "# エンジニアリングの指針\n\n設計の選択を説明し、見直すためのCoelaの指針です。すべての場面に適用する規則や、システムを操作する許可ではありません。\n\n## データを所有者の管理下に置く\n\nローカルファーストと明示的な同期を基本にします。保存先の責任、バックアップ、復旧、エクスポートを、クラウド中継なしでも理解できる構成を目指します。\n\n## コンポーネントの責務を明確にする\n\n業務情報、言語の意味、通信、資格情報の保管、実行方針を分けます。共通契約の実装はライブラリへ置き、製品側には固有の判断と対応付けを残します。\n\n## 権限を明示する\n\n提案が妥当でも、操作の許可が得られたことにはなりません。資料の閲覧、配布物の受領、発行者の信頼、導入、操作の実行は、それぞれ判断と根拠を必要とします。\n\n## 根拠と不確実性を残す\n\n実装、開発試験、パッケージ公開、配備、実際の利用を区別します。未取得・部分取得・未検証を、成功として扱いません。\n\n## 保守できる実装を選ぶ\n\n適する範囲でRustをコアに、厳格なTypeScriptをUI・連携に使います。小さな責務、意味のある命名、公開された依存パッケージを優先し、現在の必要性がない独自基盤や互換処理を増やしません。\n"
